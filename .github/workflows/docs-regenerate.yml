name: Regenerate docs

on:
  workflow_dispatch:
  push:
    branches: [main, master]

permissions:
  contents: write

concurrency:
  group: docs-regenerate
  cancel-in-progress: false

jobs:
  regenerate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - run: pip install pyyaml

      - run: python3 docs/generate.py

      - name: Commit if docs changed
        run: |
          git add -A docs/
          if git diff --cached --quiet; then
            echo "Docs already up to date."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "docs: regenerate code-derived docs [skip ci]"
          for i in 1 2 3 4 5; do
            git push && exit 0
            git pull --rebase && continue
            sleep 5
          done
          echo "::error::could not push the regenerated docs after retries"
          exit 1
